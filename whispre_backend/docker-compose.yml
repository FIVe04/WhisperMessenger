version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whispre
      POSTGRES_USER: whispre
      POSTGRES_PASSWORD: whispre
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  migration:
    profiles:
      - tools
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_DSN: postgresql://whispre:whispre@postgres:5432/whispre
    volumes:
      - ./alembic.ini:/app/alembic.ini:ro
      - ./db/alembic:/app/db/alembic
    depends_on:
      - postgres

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      SERVICE_NAME: api-gateway
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BROKER: kafka:9092
      POSTGRES_DSN: postgresql://whispre:whispre@postgres:5432/whispre
      REDIS_URL: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      KEY_SERVICE_URL: http://key-service:8000
      CONVERSATION_SERVICE_URL: http://conversation-service:8000
      MESSAGE_SERVICE_URL: http://message-service:8000
      REALTIME_SERVICE_URL: http://realtime-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      JWT_SECRET: dev-change-me
      JWT_ALGORITHM: HS256
      RATE_LIMIT_REQUESTS_PER_MINUTE: 240
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - postgres
      - redis

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      SERVICE_NAME: auth-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BROKER: kafka:9092
      POSTGRES_DSN: postgresql://whispre:whispre@postgres:5432/whispre
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-change-me
      JWT_ALGORITHM: HS256
    ports:
      - "8001:8000"
    depends_on:
      - kafka
      - postgres
      - redis

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      SERVICE_NAME: user-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BROKER: kafka:9092
      POSTGRES_DSN: postgresql://whispre:whispre@postgres:5432/whispre
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-change-me
      JWT_ALGORITHM: HS256
    ports:
      - "8002:8000"
    depends_on:
      - kafka
      - postgres

  key-service:
    build:
      context: .
      dockerfile: services/key-service/Dockerfile
    environment:
      SERVICE_NAME: key-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BROKER: kafka:9092
      POSTGRES_DSN: postgresql://whispre:whispre@postgres:5432/whispre
      JWT_SECRET: dev-change-me
      JWT_ALGORITHM: HS256
    ports:
      - "8003:8000"
    depends_on:
      - kafka
      - postgres

  conversation-service:
    build:
      context: .
      dockerfile: services/conversation-service/Dockerfile
    environment:
      SERVICE_NAME: conversation-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BROKER: kafka:9092
      POSTGRES_DSN: postgresql://whispre:whispre@postgres:5432/whispre
      JWT_SECRET: dev-change-me
      JWT_ALGORITHM: HS256
    ports:
      - "8004:8000"
    depends_on:
      - kafka
      - postgres

  message-service:
    build:
      context: .
      dockerfile: services/message-service/Dockerfile
    environment:
      SERVICE_NAME: message-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BROKER: kafka:9092
      POSTGRES_DSN: postgresql://whispre:whispre@postgres:5432/whispre
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-change-me
      JWT_ALGORITHM: HS256
      KAFKA_TOPIC_ENVELOPE_ACCEPTED: message.envelope.accepted.v1
    ports:
      - "8005:8000"
    depends_on:
      - kafka
      - postgres
      - redis

  realtime-service:
    build:
      context: .
      dockerfile: services/realtime-service/Dockerfile
    environment:
      SERVICE_NAME: realtime-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://whispre:whispre@postgres:5432/whispre
      JWT_SECRET: dev-change-me
      JWT_ALGORITHM: HS256
      KAFKA_TOPIC_ENVELOPE_ACCEPTED: message.envelope.accepted.v1
    ports:
      - "8006:8000"
    depends_on:
      - kafka
      - redis

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      SERVICE_NAME: notification-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BROKER: kafka:9092
      POSTGRES_DSN: postgresql://whispre:whispre@postgres:5432/whispre
      JWT_SECRET: dev-change-me
      JWT_ALGORITHM: HS256
      KAFKA_TOPIC_ENVELOPE_ACCEPTED: message.envelope.accepted.v1
      KAFKA_CONSUMER_GROUP: notification-service-v1
    ports:
      - "8007:8000"
    depends_on:
      - kafka
      - postgres

  prometheus:
    image: prom/prometheus:v3.5.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api-gateway
      - auth-service
      - user-service
      - key-service
      - conversation-service
      - message-service
      - realtime-service
      - notification-service
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.2
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.16.1
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${CONTAINER_SOCKET_PATH:-/run/user/501/podman/podman.sock}:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    security_opt:
      - label=disable
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.3-security-02
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data_v12:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  pg_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data_v12:
