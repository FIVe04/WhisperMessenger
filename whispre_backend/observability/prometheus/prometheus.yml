global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: whispre-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8000
          - auth-service:8000
          - user-service:8000
          - key-service:8000
          - conversation-service:8000
          - message-service:8000
          - realtime-service:8000
          - notification-service:8000
